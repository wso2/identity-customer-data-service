# version.txt holds the last released version and moves only when a release is created,
# never on a PR merge. This workflow owns it: it resolves the version to release from
# the dispatch inputs, commits it to the release branch, builds from it and tags that
# commit. A scheduled release is a `minor` bump off main; a maintenance release is
# a `patch` bump off the relevant release branch.
#
# One revision produces every supported platform pack, so a release and the
# updates later published from it carry executables built from the same code.

name: 🚀 CDS Release Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build the release from'
        required: false
        type: string
        default: 'main'
      version:
        description: 'Release version (e.g. v0.4.0). Overrides bump_type and use_existing_version.'
        required: false
        type: string
        default: ''
      bump_type:
        description: 'Version bump to apply to version.txt. Ignored when version is given.'
        required: false
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor
      use_existing_version:
        description: 'Release version.txt as-is (no bump). Ignored when version is given.'
        required: false
        type: boolean
        default: false
      commit_version_bump:
        description: 'Commit the resolved version to version.txt on the release branch'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_BRANCH: ${{ inputs.branch || 'main' }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.CDS_RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Resolve the version to release:
      #   version              -> used as given, wins over the rest
      #   use_existing_version -> version.txt as-is, nothing to commit
      #   bump_type            -> applied to version.txt (default)
      # -------------------------------------------------------
      - name: 🧩 Determine release version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          USE_EXISTING="${{ github.event.inputs.use_existing_version }}"
          COMMIT_BUMP="${{ github.event.inputs.commit_version_bump }}"

          VERSION_INPUT=$(printf '%s' "$VERSION_INPUT" | tr -d '[:space:]')

          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
            # Accept the version with or without the leading 'v'.
            [[ $VERSION == v* ]] || VERSION="v$VERSION"
            COMMIT_VERSION="$COMMIT_BUMP"
            echo "✅ Using version from workflow input: $VERSION"
          else
            if [ ! -f version.txt ] || [ -z "$(tr -d '[:space:]' < version.txt)" ]; then
              echo "❌ version.txt not found or empty"
              exit 1
            fi

            CURRENT=$(tr -d '[:space:]' < version.txt)
            SEMVER="${CURRENT#v}"

            if [[ $SEMVER =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            else
              echo "❌ Could not parse version '$CURRENT' from version.txt"
              exit 1
            fi

            if [ "$USE_EXISTING" == "true" ]; then
              VERSION="$CURRENT"
              COMMIT_VERSION="false"
              echo "✅ Releasing version.txt as-is: $VERSION"
            else
              case "$BUMP_TYPE" in
                patch)
                  VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                  ;;
                minor)
                  VERSION="v${MAJOR}.$((MINOR + 1)).0"
                  ;;
                major)
                  VERSION="v$((MAJOR + 1)).0.0"
                  ;;
                *)
                  echo "❌ Invalid bump_type '$BUMP_TYPE'. Must be patch, minor or major."
                  exit 1
                  ;;
              esac
              COMMIT_VERSION="$COMMIT_BUMP"
              echo "✅ Bumped $CURRENT -> $VERSION ($BUMP_TYPE)"
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_version=$COMMIT_VERSION" >> $GITHUB_OUTPUT

      - name: ✅ Validate release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.-]+)?$ ]]; then
            echo "❌ Version '$VERSION' does not follow vX.Y.Z[-PRERELEASE]"
            exit 1
          fi

          # The tag is the release identity, so refuse to release one twice.
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Version '$VERSION' already exists as a git tag"
            echo "❌ Pass a new 'version' input or a different bump_type"
            exit 1
          fi

          echo "✅ Version '$VERSION' is valid and unreleased"

      # Always written so `make dist` names the packs after the release
      # version; only committed when the release is meant to move the branch.
      - name: 🏷️ Set product version
        run: |
          echo "${{ steps.version.outputs.version }}" > version.txt
          echo "✅ version.txt set to ${{ steps.version.outputs.version }}"

      - name: 📤 Commit & push version bump
        if: ${{ steps.version.outputs.commit_version == 'true' }}
        run: |
          git config user.name "wso2-iam-bot"
          git config user.email "wso2-iam-bot@users.noreply.github.com"
          git add version.txt

          if git diff --cached --quiet; then
            echo "✅ version.txt already at ${{ steps.version.outputs.version }}"
          else
            git commit -m "Version bump: ${{ steps.version.outputs.version }}"
            git push origin "HEAD:${RELEASE_BRANCH}"
            echo "✅ Pushed version bump to ${RELEASE_BRANCH}"
          fi

      - name: ⚙️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Build
        run: make dist

      - name: Check the pack contents
        run: distribution/check-pack.sh target/dist

      # The last point at which a broken acquisition path can be caught, and
      # it is caught by driving the real installer against the artifacts this
      # run is about to publish.
      - name: Verify the bootstrap installation
        run: distribution/verify-install.sh target/dist

      - name: Summarise the artifacts
        run: distribution/artifact-summary.sh target/dist >> "$GITHUB_STEP_SUMMARY"

      # Retained so the executable of each platform pack can be taken from the
      # same revision when the release is onboarded to the update service.
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: cds-packages
          path: target/dist/*
          if-no-files-found: error

      # Tag HEAD explicitly so the tag lands on the version bump commit rather
      # than on the commit the workflow was dispatched against.
      - name: 🏷️ Create git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "wso2-iam-bot"
          git config user.email "wso2-iam-bot@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "✅ Tagged $VERSION"

      # GitHub groups the merged pull requests by the categories in
      # .github/release.yml. Asking for it here, rather than letting the
      # release action append it, is what lets the change list sit between the
      # installation instructions and the licence instead of at the end.
      - name: 📝 Generate the change list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
               -f tag_name="${{ steps.version.outputs.version }}" \
               --jq .body > target/changelog.md 2>/dev/null; then
            echo "✅ Generated the change list"
          else
            : > target/changelog.md
            echo "⚠️ Could not generate the change list; the release body will omit it"
          fi

      # Built from the artifacts themselves, so what the page says a release
      # contains cannot drift from what it contains.
      - name: 📝 Write the release notes
        run: |
          distribution/release-notes.sh target/dist "${{ steps.version.outputs.version }}" \
            --changelog target/changelog.md > target/release-notes.md
          cat target/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "CDS ${{ steps.version.outputs.version }}"
          prerelease: ${{ github.event.inputs.prerelease }}
          # The body already carries the change list, generated above and
          # placed deliberately, so the action must not append a second one.
          body_path: target/release-notes.md
          generate_release_notes: false
          # The zips, their checksums, and the compatibility metadata the
          # bootstrap installer reads to resolve a release for an Identity
          # Server version.
          files: |
            target/dist/*.zip
            target/dist/*.sha256
            target/dist/*.md5
            target/dist/*-release-metadata.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
