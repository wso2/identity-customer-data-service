# Overrides merged onto the repository's config/repository/conf/deployment.yaml
# to produce the CDS configuration for a local run. Only the keys below are
# touched; everything else in the shipped file (required_scopes, cache, queue
# names, ...) is carried over untouched.
#
# ${NAME} is filled in by lib/render_cds_config.py. ${int:NAME} becomes a
# number instead of a string, which is how the shipped file types these keys.

env: dev

log:
  log_level: ${CDS_LOG_LEVEL}

addr:
  host: ${CDS_LISTEN_HOST}
  port: ${int:CDS_PORT}

server_url: ${CDS_BASE}

auth:
  # The Console is served by the Identity Server and calls CDS cross-origin, so
  # the IS origin has to be allowed here or every Console request is blocked.
  # The rest are the identity-apps dev servers, handy when running the Console
  # from source against this setup.
  cors_allowed_origins:
    - ${IS_BASE}
    - ${CDS_BASE}
    - https://localhost:9001
    - https://localhost:9000
    - http://localhost:3000
    - http://localhost:3001

auth_server:
  host: ${IS_HOST}
  port: ${IS_PORT}
  adu_is_hostname: ${IS_HOST}
  cookieDomain: ${IS_HOST}
  client_id: ${SYS_CLIENT_ID}
  client_secret: ${SYS_CLIENT_SECRET}
  # Introspection uses the same client credentials, which the Identity Server
  # accepts thanks to the [[resource.access_control]] override that
  # templates/is-deployment.toml puts on /oauth2/introspect.
  introspection_client_id: ${SYS_CLIENT_ID}
  introspection_client_secret: ${SYS_CLIENT_SECRET}
  # Shared secret for the IS -> CDS sync endpoints; must match
  # [customer_data_service] admin_username/admin_password on the IS side.
  admin_username: ${CDS_SYNC_USER}
  admin_password: ${CDS_SYNC_PASS}
  isSystemAppGrantEnabled: false

tls:
  mtls_enabled: false          # the Identity Server does not present a client certificate
  cert_dir: ${CERT_DIR}
  server_cert: server.crt
  server_key: server.key
  trust_store: trust_store.pem

message_queue:
  broker:
    password: ''

# Must match [console.extensions] cds_application_identifier_type in
# templates/is-deployment.toml.
application_identifier_type: client_id

# One of these replaces `datasource` outright, chosen by --db. A merge would
# leave the shipped PostgreSQL keys behind on an SQLite run.
datasource_variants:
  sqlite:
    type: sqlite
    sqlite:
      path: repository/database/cds.db
  postgres:
    type: postgres
    hostname: ${PG_HOST}
    port: ${int:PG_PORT}
    username: ${PG_USER}
    password: ${PG_PASS}
    name: ${PG_DB}
    sslmode: disable
